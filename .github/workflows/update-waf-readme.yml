name: Update WAF Offenders README

on:
  push:
    paths:
      - "waf/waf-offenders.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Recompute README from waf-offenders.txt
        shell: bash
        run: |
          set -euo pipefail

          FILE="waf/waf-offenders.txt"

          if [ ! -f "$FILE" ]; then
            echo "::error::${FILE} not found"
            exit 1
          fi

          ENTRY_COUNT=$(grep -vc '^#' "$FILE" || true)

          # Pull the metadata the proxy already writes into its own header
          # comments, rather than re-stating it by hand in the README.
          SOURCE_LINE=$(grep -m1 '^# Source:' "$FILE" | sed 's/^# Source: //')
          WINDOW_LINE=$(grep -m1 '^# Window:' "$FILE" | sed 's/^# Window: //')
          PROXY_UPDATED=$(grep -m1 '^# Updated:' "$FILE" | sed 's/^# Updated: //')

          {
            echo "# WAF Offenders"
            echo
            echo "Source IPs blocked by [Coraza](https://coraza.io) / OWASP CRS at the DePaul cyber range edge reverse proxy. This is a **source**, not a consumable EDL — it has no fetch-and-build workflow of its own. The edge proxy commits directly to \`waf-offenders.txt\`, and this README is regenerated automatically whenever that file changes. The [threat feed workflow](../.github/workflows/update-threat-edl.yml) merges it into [\`combined-threat-ips.txt\`](../threat/) on its next run."
            echo
            echo "## Format"
            echo
            echo "Plain text, one IPv4 address per line, preceded by a \`#\`-prefixed header block giving source, window, and last-updated time. No CIDR aggregation — this is raw log output, not built for direct EDL use."
            echo
            echo "## Details"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Source | ${SOURCE_LINE:-unknown} |"
            echo "| Window | ${WINDOW_LINE:-unknown} |"
            echo "| Push cadence | Hourly, by the edge proxy directly |"
            echo "| Consumed by | [Combined Threat IPs](../threat/) feed, daily at 04:30 UTC |"
            echo "| Current entries | ${ENTRY_COUNT} |"
            echo "| Proxy last updated | ${PROXY_UPDATED:-unknown} |"
            echo "| README last computed | $(date -u '+%Y-%m-%d %H:%M:%S') UTC |"
            echo
            echo "## Notes"
            echo
            echo "- Entries age out 14 days after they were last seen at the proxy."
            echo "- This repo is public. Review the file before assuming an entry is hostile — it's a raw block log, not a curated or attributed threat list."
            echo "- Don't point a Palo EDL object directly at \`waf-offenders.txt\`; use the [combined threat feed](../threat/) instead, which already includes it."
          } > waf/README.md

      - name: Commit updated README
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add waf/README.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update WAF offenders README"
            git push
          fi
